<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="pp-modelo" content="6">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Premiações das lojas · Grupo Xambre (acesso com senha)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23ff6a1a%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2236%22 font-family=%22Arial%22 font-weight=%22900%22 text-anchor=%22middle%22 fill=%22%23160900%22%3EX%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premiações · Grupo Xambre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fs:Sora,"Segoe UI",system-ui,Arial,sans-serif; --fm:Manrope,"Segoe UI",system-ui,Arial,sans-serif;
  --bg:#06070a; --vidro:rgba(14,15,18,.72); --vidro2:rgba(255,255,255,.04); --borda:rgba(255,255,255,.08);
  --tx:#f6f2ea; --tx2:#b3ada2; --tx3:#7d776d;
  --lar:#ff7a1a; --lar2:#ff5a00; --grad:linear-gradient(135deg,#ff9a2e,#ff5a00);
  --ouro:#f5c400; --awk:#ff6a1a;
  --verde:#35d07f; --amarelo:#f5c400; --laranja:#ff8a2a; --vermelho:#ff4d3d;
  --sombra:0 18px 50px rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-tema="claro"]{
  --bg:#f3f1ec; --vidro:rgba(255,255,255,.78); --vidro2:rgba(23,20,15,.035); --borda:rgba(23,20,15,.1);
  --tx:#17140f; --tx2:#5c564c; --tx3:#8a8478; --lar:#ec5f00; --lar2:#c94a00;
  --ouro:#b98f00; --awk:#e05200;
  --verde:#1f9d5c; --amarelo:#a88300; --laranja:#d26500; --vermelho:#d23a2c;
  --sombra:0 14px 40px rgba(60,40,10,.12); color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-tema="auto"]{
    --bg:#f3f1ec; --vidro:rgba(255,255,255,.78); --vidro2:rgba(23,20,15,.035); --borda:rgba(23,20,15,.1);
    --tx:#17140f; --tx2:#5c564c; --tx3:#8a8478; --lar:#ec5f00; --lar2:#c94a00;
    --ouro:#b98f00; --awk:#e05200;
    --verde:#1f9d5c; --amarelo:#a88300; --laranja:#d26500; --vermelho:#d23a2c;
    --sombra:0 14px 40px rgba(60,40,10,.12); color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,"Segoe UI",Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20% -10% auto auto;width:70vw;height:70vw;border-radius:50%;
  background:radial-gradient(circle,rgba(255,122,26,.16),transparent 62%);pointer-events:none;z-index:0}
body{overflow-x:hidden;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lar);outline-offset:2px}
.sora{font-family:Sora,Manrope,system-ui,sans-serif}
.oculto{display:none!important}
.vidro{background:var(--vidro);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--borda);border-radius:22px;box-shadow:var(--sombra)}

/* ---------- entrada ---------- */
#entrada{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-start;padding:20px 14px 40px}
.cartao-entrada{width:min(980px,100%);padding:30px 30px 26px}
.entrada-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;align-items:start}
.bloco-lojas{min-width:0}
.bloco-senha{position:sticky;top:16px;background:var(--vidro2);border:1px solid var(--borda);border-radius:18px;padding:18px}
.passo{display:flex;align-items:center;gap:8px;font-family:var(--fs);font-weight:700;font-size:14px;margin:0 0 10px}
.passo i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#1a0b00;font-size:12.5px}
.grupo-marca{margin:12px 0 6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.grupo-marca.af{color:var(--ouro)} .grupo-marca.awk{color:var(--awk)} .grupo-marca.out{color:var(--tx2)}
.chips-lojas{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.chip-loja{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--borda);background:var(--vidro2);border-radius:14px;padding:9px 11px;text-align:left;color:var(--tx);transition:border-color .15s,background .15s}
.chip-loja b{font-family:var(--fs);font-size:15px}
.chip-loja small{font-size:11px;color:var(--tx2)}
.chip-loja:hover{border-color:rgba(255,122,26,.6)}
.chip-loja[aria-pressed="true"]{border-color:var(--lar);background:rgba(255,122,26,.14);box-shadow:0 0 0 3px rgba(255,122,26,.12)}
.lista-entrada-vazia{color:var(--tx2);font-size:13.5px;padding:10px 2px}
.loja-escolhida{font-family:var(--fs);font-weight:800;font-size:22px;margin:0 0 12px;line-height:1.15}
.loja-escolhida small{display:block;font-family:var(--fm);font-weight:600;font-size:12.5px;color:var(--tx2);margin-top:3px}
.link-rh{display:block;margin:12px auto 0;background:none;border:0;color:var(--tx2);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link-rh[aria-pressed="true"]{color:var(--lar)}
#falha{position:fixed;left:12px;right:12px;bottom:12px;z-index:50;background:#3a0d08;color:#ffd9d3;border:1px solid #ff4d3d;border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600}
.rodape-app{margin:26px 4px 6px;text-align:center;color:var(--tx3);font-size:12px}
/* página própria (GitHub): sem as limitações do quadro do Wix */
html.pagina #entrada{min-height:100vh;align-items:center}
html.pagina #app{max-width:1600px;margin:0 auto}
html.pagina .topo{position:sticky;top:10px;z-index:20;background:var(--vidro);background:color-mix(in srgb, var(--bg) 88%, transparent)}
@media (max-width:860px){ .entrada-grid{grid-template-columns:1fr} .bloco-senha{position:static} .com-loja .bloco-senha{order:-1} }
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--tx);background:none;border:0;padding:0}
.logo-marca{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;
  font-family:var(--fs);font-weight:800;color:#160900;font-size:19px;box-shadow:0 6px 22px rgba(255,90,0,.35)}
.logo-txt{font-family:var(--fs);font-weight:700;font-size:17px;line-height:1.05;text-align:left}
.logo-txt small{display:block;font-family:var(--fm);font-weight:500;font-size:11.5px;color:var(--tx2);margin-top:3px}
.cartao-entrada h1{font-family:var(--fs);font-size:27px;font-weight:700;margin:26px 0 6px;letter-spacing:-.01em}
.cartao-entrada p.sub{margin:0 0 22px;color:var(--tx2);line-height:1.5}
.campo{display:block;margin-bottom:12px}
.campo span{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.campo select,.campo input{width:100%;height:48px;border-radius:14px;border:1px solid var(--borda);background:var(--vidro2);
  padding:0 14px;font-size:15px}
.campo input{letter-spacing:.12em;text-transform:uppercase}
.campo select option{background:var(--bg);color:var(--tx)}
.btn-prim{width:100%;height:50px;border:0;border-radius:999px;background:var(--grad);color:#1a0b00;font-weight:700;font-size:15.5px;
  box-shadow:0 10px 28px rgba(255,90,0,.32);transition:transform .15s, box-shadow .15s}
.btn-prim:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(255,90,0,.42)}
.btn-prim:disabled{opacity:.6;cursor:wait;transform:none}
.erro{min-height:20px;margin:10px 0 0;color:var(--vermelho);font-size:13.5px;font-weight:600}
.rodape-entrada{margin-top:16px;font-size:12px;color:var(--tx3);line-height:1.5}

/* ---------- app ---------- */
.corpo > *,.heroi > div{min-width:0}
.so-mobile{display:none}
.sel-loja-m{width:100%;height:46px;border-radius:14px;border:1px solid var(--borda);background:var(--vidro2);padding:0 12px;font-weight:700;font-size:16px}
.sel-loja-m option{background:var(--bg);color:var(--tx)}
.versao{font-size:12px;color:var(--tx3)}
.chip-corr{display:inline-block;font-size:11.5px;font-weight:700;color:var(--verde);border:1px solid currentColor;border-radius:999px;padding:2px 9px}
.p-abrir{all:unset;display:flex;flex-direction:column;gap:8px;cursor:pointer;border-radius:12px}
.p-abrir:focus-visible{outline:2px solid var(--lar);outline-offset:4px}
.detalhe .motivos{display:grid;gap:8px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--borda)}
.motivos h4{margin:4px 0 0;font-size:12.5px;color:var(--tx2);font-weight:700}
.detalhe .mot-linha{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.mot-linha select,.mot-linha input{height:36px;border-radius:10px;border:1px solid var(--borda);background:var(--bg);padding:0 8px;font-size:13px;min-width:0}
.mot-dia{grid-column:1/-1;font-size:11.5px;color:var(--tx3);margin-top:-3px}
.mot-dia.regra{color:var(--amarelo)}
.btn-x{width:36px;height:36px;border-radius:10px;border:1px solid var(--borda);background:none;color:var(--tx2);font-size:16px}
.btn-x:hover{color:var(--vermelho);border-color:var(--vermelho)}
.btn-mais{height:34px;border-radius:999px;border:1px dashed var(--lar);background:none;color:var(--lar);font-weight:700;font-size:13px;padding:0 14px;justify-self:start}
.chip-mot{display:inline-block;font-size:12px;font-weight:600;color:var(--amarelo);border:1px solid currentColor;border-radius:999px;padding:2px 9px;margin:2px 4px 0 0}
.ponto{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lar);margin-left:6px;vertical-align:middle}
.modal-fundo{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;padding:24px 14px;overflow:auto}
.modal{width:min(640px,100%);padding:22px}
.modal h3{font-family:var(--fs);margin:0 0 6px;font-size:18px}
.modal p{color:var(--tx2);font-size:13.5px;line-height:1.5;margin:0 0 12px}
.modal textarea{width:100%;height:180px;border-radius:12px;border:1px solid var(--borda);background:var(--bg);color:var(--tx);padding:10px;font:12px/1.4 Consolas,monospace}
.modal .acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn-sec{height:40px;border-radius:999px;border:1px solid var(--borda);background:var(--vidro2);padding:0 16px;font-weight:700;font-size:13.5px}
.btn-sec.perigo{color:var(--vermelho);border-color:var(--vermelho)}
.btn-sec.laranja{background:var(--grad);color:#1a0b00;border:0}
.sino{position:relative;width:40px;padding:0;display:inline-grid;place-items:center}
.sino svg{width:18px;height:18px}
.sino .badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:999px;background:var(--vermelho);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg)}
.p-acoes{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.btn-contestar{height:32px;border-radius:999px;border:1px solid var(--borda);background:none;color:var(--tx2);font-weight:700;font-size:12.5px;padding:0 13px}
.btn-contestar:hover{color:var(--lar);border-color:var(--lar)}
.st{display:inline-block;font-size:11.5px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:2px 9px}
.st-Aberta{color:var(--amarelo)} .st-Em-análise{color:#5aa7ff} .st-Resolvida{color:var(--verde)} .st-Recusada{color:var(--vermelho)}
.hist-cont{display:grid;gap:8px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--borda)}
.hist-cont h4{margin:0;font-size:12.5px;color:var(--tx2)}
.item-cont{background:var(--vidro2);border:1px solid var(--borda);border-radius:12px;padding:10px;font-size:13px;display:grid;gap:5px}
.item-cont .topo-c{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.item-cont .resp{border-left:3px solid var(--verde);padding-left:8px;color:var(--tx)}
.item-cont small{color:var(--tx3)}
.campo-m{display:grid;gap:6px;margin-bottom:12px}
.campo-m span{font-size:12.5px;font-weight:700;color:var(--tx2)}
.campo-m select,.campo-m textarea{border-radius:12px;border:1px solid var(--borda);background:var(--bg);color:var(--tx);padding:10px;font-size:15px}
.campo-m select{height:44px;padding:0 10px}
.modal .campo-m textarea{height:auto;min-height:96px;resize:vertical;font:inherit;font-size:15px}
.filtros-c{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filtros-c button[aria-pressed="true"]{background:var(--grad);color:#1a0b00;border:0}
.lista-c{display:grid;gap:10px;max-height:none}
.demo{font-size:11px;font-weight:800;color:#1a0b00;background:var(--amarelo);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
#app{position:relative;z-index:1;padding:12px 14px 40px;width:100%}
.topo{display:flex;align-items:center;gap:14px;padding:10px 12px;flex-wrap:wrap}
.abas{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--vidro2);border:1px solid var(--borda);margin:0 auto}
.aba{position:relative;z-index:1;border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--tx2);white-space:nowrap}
.aba[aria-selected="true"]{color:#1a0b00}
.indicador{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:999px;background:var(--grad);transition:left .28s cubic-bezier(.3,.8,.3,1),width .28s cubic-bezier(.3,.8,.3,1)}
.ferr{display:flex;align-items:center;gap:8px}
.mini{white-space:nowrap;height:36px;border-radius:999px;border:1px solid var(--borda);background:var(--vidro2);padding:0 13px;font-size:13px;font-weight:600}
.mini select{border:0;background:none}
select.mini option{background:var(--bg)}

.corpo{display:grid;grid-template-columns:340px 1fr;gap:16px;margin-top:16px;align-items:start}
.corpo.sem-painel{grid-template-columns:1fr}
.painel{padding:14px}
.painel h3{font-family:var(--fs);font-size:14px;margin:4px 6px 10px;color:var(--tx2);font-weight:600}
.busca{width:100%;height:42px;border-radius:14px;border:1px solid var(--borda);background:var(--vidro2);padding:0 14px;margin-bottom:10px}
.item-loja{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;
  background:none;border-radius:14px;padding:9px 10px}
.item-loja:hover{background:var(--vidro2)}
.item-loja[aria-current="true"]{border-color:var(--lar);background:rgba(255,122,26,.08)}
.selo{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.item-loja .selo{min-width:44px;justify-content:center}
.selo.af{color:var(--ouro)} .selo.awk{color:var(--awk)}
.item-loja b{font-family:var(--fs);font-size:14px;font-weight:600}
.item-loja .val{font-family:var(--fs);font-size:13px;font-weight:600}
.barra{height:4px;border-radius:4px;background:var(--vidro2);overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;background:var(--grad);border-radius:4px}

.principal{display:flex;flex-direction:column;gap:16px;min-width:0}
.heroi{padding:24px 26px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px;justify-content:space-between}
.heroi h2{overflow-wrap:anywhere;font-family:var(--fs);font-size:clamp(34px,5vw,52px);line-height:1;margin:8px 0 10px;font-weight:800;letter-spacing:-.02em}
.heroi .meta-l{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--tx2);font-size:13.5px}
.status{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;color:#1a0b00;background:var(--lar)}
.status.fechado{background:var(--ouro)}
.total-heroi{text-align:right}
.total-heroi small{display:block;color:var(--tx2);font-size:12.5px;font-weight:600;margin-bottom:4px}
.total-heroi strong{font-family:var(--fs);font-weight:800;font-size:clamp(30px,4.4vw,46px);letter-spacing:-.02em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:16px 18px;border-radius:18px}
.kpi small{color:var(--tx2);font-size:12.5px;font-weight:600}
.kpi strong{display:block;font-family:var(--fs);font-size:24px;font-weight:700;margin:6px 0 4px}
.kpi span{color:var(--tx3);font-size:12.5px}

.secao{padding:18px 20px}
.secao h3{font-family:var(--fs);font-size:16px;margin:0 0 4px;font-weight:700}
.secao .desc{color:var(--tx2);font-size:13px;margin:0 0 14px}
.grade{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:12px}
.pessoa{position:relative;text-align:left;color:inherit;font:inherit;border:1px solid var(--borda);background:var(--vidro2);border-radius:16px;padding:14px 14px 12px;
  display:flex;flex-direction:column;gap:8px;transition:border-color .15s, box-shadow .15s}
.pessoa:hover{border-color:rgba(255,122,26,.55);box-shadow:0 0 0 4px rgba(255,122,26,.08)}
.pessoa[aria-expanded="true"]{border-color:var(--lar)}
.p-topo{display:flex;gap:11px;align-items:center}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--fs);font-weight:700;font-size:14px;
  background:rgba(255,122,26,.14);color:var(--lar);border:1px solid rgba(255,122,26,.35)}
.p-nome{font-weight:700;font-size:14.5px;line-height:1.2}
.p-func{font-size:12px;color:var(--tx2);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.trainee{font-size:11px;font-weight:700;color:var(--ouro);border:1px solid currentColor;border-radius:999px;padding:1px 7px}
.p-val{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.p-val strong{font-family:var(--fs);font-size:21px;font-weight:700}
.p-val strong.zero{color:var(--tx3)}
.faixa{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.f-verde{color:var(--verde)} .f-amarelo{color:var(--amarelo)} .f-laranja{color:var(--laranja)} .f-vermelho{color:var(--vermelho)}
.mais-alto{position:absolute;top:-9px;right:12px;font-size:10.5px;font-weight:800;color:#1a0b00;background:var(--grad);padding:3px 9px;border-radius:999px}
.detalhe{border-top:1px dashed var(--borda);padding-top:9px;font-size:13px;display:grid;gap:5px}
.detalhe > div:not(.motivos){display:flex;justify-content:space-between;gap:10px}
.detalhe span{color:var(--tx2)}
.detalhe .nota{display:block;color:var(--amarelo);font-size:12.5px}

table.tab{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{text-align:left;font-size:12px;color:var(--tx2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--borda)}
.tab td{padding:10px;border-bottom:1px solid var(--borda)}
.tab td.n,.tab th.n{text-align:right;font-variant-numeric:tabular-nums}
.tab tr.clic{cursor:pointer}
.tab tr.clic:hover td{background:var(--vidro2)}
.rolagem{overflow-x:auto}
.ok{color:var(--verde);font-weight:700} .nok{color:var(--vermelho);font-weight:700}
.vazio{color:var(--tx2);padding:18px 4px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;z-index:20;
  padding:11px 18px;border-radius:999px;font-weight:600;font-size:13.5px}
.toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:980px){
  .corpo{grid-template-columns:1fr}
  .painel{position:static;max-height:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .abas{order:3;width:100%;overflow-x:auto;margin:0}
}
@media (max-width:980px){
  .so-mobile{display:block}
  .painel{display:none!important}
  .corpo{margin-top:10px;gap:10px}
}
@media (max-width:640px){
  html,body{font-size:14.5px}
  body::before{width:120vw;height:120vw}
  #entrada{padding:10px 8px 28px}
  .cartao-entrada{padding:20px 14px 18px;border-radius:20px}
  .chips-lojas{grid-template-columns:repeat(3,1fr);gap:6px}
  .chip-loja{padding:8px 9px}
  .chip-loja b{font-size:14px}
  html.pagina .topo{top:6px}
  .cartao-entrada h1{font-size:23px;margin-top:18px}
  .campo select,.campo input{font-size:16px}
  #app{padding:8px 8px 32px}
  .topo{padding:10px;gap:10px;border-radius:18px}
  .logo-txt{font-size:15.5px}
  .ferr{width:100%;flex-wrap:wrap;gap:6px}
  .ferr .mini{height:36px;padding:0 11px;font-size:13px;flex:1 1 auto}
  .ferr select.mini{flex:1 1 100%;font-size:16px}
  .ferr .rotulo{display:none}
  .abas{border-radius:14px;flex-wrap:wrap;overflow:visible}
  .col-opc{display:none}
  .aba{padding:8px 12px;font-size:13px}
  .principal{gap:10px}
  .vidro{border-radius:18px}
  .heroi{padding:16px;gap:10px}
  .heroi h2{font-size:30px;margin:6px 0 4px}
  .total-heroi{text-align:left}
  .total-heroi strong{font-size:30px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px}
  .kpi strong{font-size:18px}
  .kpi small,.kpi span{font-size:11.5px}
  .secao{padding:14px 12px}
  .grade{grid-template-columns:1fr;gap:10px}
  .pessoa{padding:12px}
  .p-val strong{font-size:19px}
  .busca{font-size:16px}
  .tab{font-size:12.5px}
  .tab td,.tab th{padding:8px 6px}
  .detalhe .mot-linha select,.detalhe .mot-linha input{font-size:16px;height:40px}
  .modal{padding:16px}
  .modal-fundo{padding:10px 8px}
  .toast{width:calc(100% - 24px);text-align:center;border-radius:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="entrada">
  <form class="vidro cartao-entrada" id="form-entrada" autocomplete="off" onsubmit="return false">
    <div class="logo"><div class="logo-marca">X</div><div class="logo-txt">Premiações<small>Grupo Xambre · Recursos Humanos</small></div></div>
    <h1>Consulte a premiação da sua loja</h1>
    <p class="sub" id="sub-entrada">Escolha a sua loja na lista e digite a senha recebida do DP.</p>
    <div class="entrada-grid">
      <div class="bloco-lojas">
        <p class="passo"><i>1</i>Escolha a loja</p>
        <input class="busca" id="busca-entrada" placeholder="Buscar loja (ex.: 188 ou AWK 13)" autocomplete="off" aria-label="Buscar loja">
        <div id="lista-entrada"><p class="lista-entrada-vazia">Carregando lojas…</p></div>
      </div>
      <div class="bloco-senha">
        <p class="passo"><i>2</i>Digite a senha</p>
        <div class="loja-escolhida" id="loja-escolhida">Nenhuma loja escolhida<small>Toque na sua loja na lista</small></div>
        <select id="sel-loja" class="oculto" aria-hidden="true" tabindex="-1"></select>
        <label class="campo"><span>Senha</span><input id="senha" type="password" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XX"></label>
        <button class="btn-prim" id="btn-entrar" type="submit">Abrir premiações</button>
        <p class="erro" id="erro" role="alert"></p>
        <button type="button" class="link-rh" id="btn-rh" aria-pressed="false">Acesso do RH · todas as lojas</button>
      </div>
    </div>
    <p class="rodape-entrada" id="rodape-entrada"></p>
  </form>
</section>

<section id="app" class="oculto">
  <header class="vidro topo">
    <button class="logo" id="btn-logo" title="Voltar ao início"><div class="logo-marca">X</div><div class="logo-txt">Premiações<small id="quem"></small></div></button>
    <nav class="abas" id="abas" role="tablist"><span class="indicador" id="ind"></span></nav>
    <div class="ferr">
      <select class="mini" id="sel-mes" title="Competência"></select>
      <button class="mini sino oculto" id="btn-sino" title="Contestações das lojas" aria-label="Contestações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge oculto" id="sino-n">0</span></button>
      <button class="mini oculto" id="btn-motivos" title="Motivos de redutor">Motivos<span class="ponto oculto" id="ponto-mot"></span></button>
      <button class="mini oculto" id="btn-cheia" title="Abrir a plataforma em tela inteira">⤢<span class="rotulo"> Tela inteira</span></button>
      <button class="mini" id="btn-tema" title="Tema"><span class="rotulo">Tema: </span><span id="tema-nome">Escuro</span></button>
      <button class="mini" id="btn-sair">Sair</button>
    </div>
  </header>
  <div class="corpo" id="corpo">
    <aside class="vidro painel" id="painel"></aside>
    <main class="principal" id="principal"></main>
  </div>
  <p class="rodape-app" id="rodape-app">Grupo Xambre · Departamento Pessoal · Premiações</p>
</section>

<div class="toast vidro" id="toast" role="status"></div>
<div id="falha" class="oculto" role="alert"></div>
<script>
function mostrarFalha(m){ var el = document.getElementById("falha"); if(!el) return;
  el.textContent = "Algo falhou ao carregar a plataforma: " + m + " · Atualize a página (Ctrl+F5). Se continuar, envie um print ao DP.";
  el.classList.remove("oculto"); }
window.addEventListener("error", function(e){ mostrarFalha(e.message || "erro desconhecido"); });
window.addEventListener("unhandledrejection", function(e){ mostrarFalha((e.reason && e.reason.message) || String(e.reason)); });
</script>

/* ---------- cripto ---------- */
const normSenha = s => s.toUpperCase().replace(/[^A-Z0-9]/g,"");
async function chaveDaSenha(senha, sal){
  const base = await crypto.subtle.importKey("raw", enc.encode(normSenha(senha)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(sal), iterations:PACOTE.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function abrir(chave, caixa){
  const bruto = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(caixa.iv)}, chave, b64(caixa.ct));
  return new Uint8Array(bruto);
}
async function chaveBruta(raw){ return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]); }
async function abrirLoja(codigo, chaveDados){
  const txt = dec.decode(await abrir(chaveDados, PACOTE.dados[codigo]));
  return JSON.parse(txt);
}

async function entrar(){
  const cod = $("#sel-loja").value, senha = $("#senha").value, erro = $("#erro"), btn = $("#btn-entrar");
  erro.textContent = "";
  if(!cod){ erro.textContent = "Escolha a loja na lista."; return; }
  if(!normSenha(senha)){ erro.textContent = "Digite a senha."; return; }
  if(!(window.crypto && crypto.subtle)){ erro.textContent = "Este navegador não permite abrir os dados protegidos. Use Chrome, Edge ou Safari atualizados."; return; }
  btn.disabled = true; btn.textContent = "Abrindo…";
  try{
    if(cod === "__RH__"){
      const k = await chaveDaSenha(senha, PACOTE.rh.s);
      const rh = JSON.parse(dec.decode(await abrir(k, PACOTE.rh)));
      for(const c of Object.keys(rh.chaves)){ E.lojas[c] = await abrirLoja(c, await chaveBruta(b64(rh.chaves[c]))); }
      E.sup = rh.supervisores || {}; E.papel = "rh"; E.token = await tokenDe("RH", senha);
      E.loja = null; E.aba = "lojas";
    } else {
      const meta = PACOTE.lojas.find(l => l.c === cod);
      const k = await chaveDaSenha(senha, meta.s);
      const raw = await abrir(k, meta.w);
      E.lojas[cod] = await abrirLoja(cod, await chaveBruta(raw));
      E.papel = "loja"; E.loja = cod; E.aba = "equipe"; E.token = await tokenDe(cod, senha);
    }
    $("#senha").value = "";
    iniciarApp();
  }catch(e){
    erro.textContent = cod === "__RH__" ? "Senha do RH incorreta." : `Senha incorreta para ${cod}.`;
  }finally{ btn.disabled = false; btn.textContent = "Abrir premiações"; }
}

function acoesCartao(p, idx, loja){

function htmlEquipe(d){
  const q = E.busca.toLowerCase();
  const pessoas = d.pessoas.map((p,i)=>({...p,_i:i})).filter(p => p.nome.toLowerCase().includes(q));
  const maxv = Math.max(0, ...d.pessoas.map(p=>p.total));
  const topoNome = maxv > 0 ? d.pessoas.find(p=>p.total===maxv).nome : null;
  const grupos = [["Gerência",["Gerente","Subgerente"]],["Vendedores",["Vendedor"]],["Assistentes de loja",["Assistente"]]];
  let h = `<section class="vidro secao"><input class="busca" id="busca-pessoa" placeholder="Buscar colaborador" value="${esc(E.busca)}" style="max-width:360px;margin:0"></section>`;
  grupos.forEach(([nome, funcs]) => {
    const lista = pessoas.filter(p => funcs.includes(p.funcao)).sort((a,b)=>b.total-a.total);
    if(!lista.length) return;
    const soma = lista.reduce((s,p)=>s+p.total,0);
    h += `<section class="vidro secao"><h3>${nome}</h3><p class="desc">${lista.length} ${lista.length>1?"pessoas":"pessoa"} · ${brl(soma)} · toque no cartão para ver o detalhe</p>
      <div class="grade">${lista.map(p => cartaoPessoa(p, p._i, maxv, p.nome===topoNome)).join("")}</div></section>`;
  });
  if(!pessoas.length) h += `<div class="vidro secao vazio">Nenhum colaborador com esse nome.</div>`;
  return h;
}

function agregarPremios(lojas){
  const m = {};
  lojas.forEach(d => d.pessoas.forEach(p => p.componentes.forEach(c => {
    const k = (p.funcao==="Subgerente"?"Gerente":p.funcao) + "|" + c.nome;
    m[k] = m[k] || {funcao:k.split("|")[0], nome:c.nome, valor:0, pessoas:new Set()};
    m[k].valor += c.final; if(c.final > .004) m[k].pessoas.add(d.codigo+p.nome);
  })));
  return Object.values(m).filter(x => x.valor > .004).sort((a,b)=>b.valor-a.valor);
}
function htmlPremios(d){
  const ag = agregarPremios([d]), max = Math.max(1, ...ag.map(a=>a.valor));
  return `<section class="vidro secao"><h3>Quanto cada prêmio pagou</h3>
  <p class="desc">Valores finais, já com dias e redutores aplicados.</p>

  ${ag.map(a=>`<tr><td><b>${esc(a.nome)}</b></td><td>${esc(a.funcao)}</td><td class="n">${a.pessoas.size}</td><td class="n">${brl(a.valor)}</td>
   <td class="col-opc"><div class="barra"><i style="width:${(a.valor/max*100).toFixed(1)}%"></i></div></td></tr>`).join("")}
  </tbody></table></div>`:'<p class="vazio">Nenhum prêmio pago neste mês.</p>'}</section>`;
}
function fmtInd(i, v){
  if(v==null) return "–";
  if(i.tipo==="R$") return brl(v);
  if(i.tipo==="%") return pct(v,2);
  if(i.tipo==="t") return String(v).toUpperCase();
  return Number(v).toLocaleString("pt-BR",{maximumFractionDigits:2});
}

function ligarEventos(){
  document.querySelectorAll("[data-loja]").forEach(el => el.onclick = () => {
    E.loja = el.dataset.loja; E.aberto = null; if(E.aba==="lojas") E.aba = "equipe"; render(); window.scrollTo({top:0,behavior:"smooth"});
  });
  document.querySelectorAll("[data-pessoa]").forEach(el => el.onclick = () => {
    E.aberto = E.aberto === el.dataset.pessoa ? null : el.dataset.pessoa; render();
    const n = document.querySelector(`[data-pessoa="${el.dataset.pessoa}"]`); if(n) n.focus({preventScroll:true});
  });
  const dLoja = E._loja && dadosLoja(E._loja);
  const pessoaIdx = i => dLoja && dLoja.pessoas[+i];
  document.querySelectorAll("[data-adicionar]").forEach(b => b.onclick = () => {
    const p = pessoaIdx(b.dataset.adicionar); if(!p) return;
    guardarMot(E._loja, p, [...motivosDe(E._loja,p), {m:"Falta", d:""}]); render();
  });
  document.querySelectorAll(".motivos[data-mot]").forEach(box => {
    const p = pessoaIdx(box.dataset.mot); if(!p) return;
    box.querySelectorAll("[data-remover]").forEach(b => b.onclick = () => {
      const l = [...motivosDe(E._loja,p)]; l.splice(+b.dataset.remover,1); guardarMot(E._loja,p,l); render();
    });
    box.querySelectorAll(".mot-linha [data-campo]").forEach(inp => inp.onchange = () => {
      const i = +inp.closest(".mot-linha").dataset.i, l = motivosDe(E._loja,p).map(x=>({...x}));
      l[i][inp.dataset.campo] = inp.value; guardarMot(E._loja,p,l);
      const di = diaInfo(l[i].d, l[i].m), sp = inp.closest(".mot-linha").querySelector(".mot-dia");
      sp.textContent = di.txt; sp.classList.toggle("regra", di.regra);
    });
  });
  document.querySelectorAll("[data-contestar]").forEach(b => b.onclick = ev => { ev.stopPropagation(); _ancora = b; abrirContestar(+b.dataset.contestar); });
  const sm = $("#sel-loja-m");
  if(sm) sm.onchange = () => { E.loja = sm.value; E.aberto = null; render(); };
  const bp = $("#busca-pessoa");
  if(bp) bp.oninput = () => { E.busca = bp.value; const pos = bp.selectionStart; render(); const n=$("#busca-pessoa"); n.focus(); n.setSelectionRange(pos,pos); };
  const bl = $("#busca-loja");
  if(bl) bl.oninput = () => { E.buscaLoja = bl.value; const pos = bl.selectionStart; render(); const n=$("#busca-loja"); n.focus(); n.setSelectionRange(pos,pos); };
}

function fecharModal(){ $("#modal-raiz").innerHTML = ""; }
let _ancora = null;
function abrirModal(html){
  $("#modal-raiz").innerHTML = `<div class="modal-fundo" id="mf"><div class="vidro modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#mf").onclick = e => { if(e.target.id === "mf") fecharModal(); };
  if(EM_IFRAME){
    // dentro do Wix o iframe é mais alto que a tela: abre a janela perto do botão clicado
    const f = $("#mf"), doc = document.documentElement;
    const topo = _ancora ? Math.max(10, _ancora.getBoundingClientRect().top + window.scrollY - 80) : 10;
    Object.assign(f.style, {position:"absolute", top:"0", left:"0", right:"0", bottom:"auto",
      height: doc.scrollHeight + "px", paddingTop: topo + "px", overflow:"visible"});
  }
  const m = document.querySelector("#mf .modal");
  if(EM_IFRAME){ const f = $("#mf"), alt = parseFloat(f.style.paddingTop) + m.offsetHeight + 20;
    if(alt > parseFloat(f.style.height)) f.style.paddingTop = Math.max(10, parseFloat(f.style.height) - m.offsetHeight - 20) + "px"; }
  try{ m.scrollIntoView({block:"start"}); }catch(e){}
}
const TIPOS_CONT = ["Valor do prêmio","Motivo / redutor","Dias considerados","Trainee / Eu Líder","Colaborador faltando","Outro"];
function abrirContestar(idx){
  const d = dadosLoja(E.loja); if(!d) return;
  const p = idx >= 0 ? d.pessoas[idx] : {nome:"(LOJA)", funcao:"Loja", total:d.total};
  abrirModal(`<h3>Contestar · ${esc(idx>=0?titulo(p.nome):"item da loja")}</h3>
    <p>${esc(nomeLoja(E.loja))} · ${compExt(E.mes)}${idx>=0?` · ${esc(p.funcao)} · valor atual ${brl(p.total)}`:""}. O RH recebe a contestação e responde por aqui.</p>
    <label class="campo-m"><span>O que está errado?</span><select id="c-tipo">${TIPOS_CONT.map(t=>`<option ${idx<0&&t==="Colaborador faltando"?"selected":""}>${t}</option>`).join("")}</select></label>
    <label class="campo-m"><span>Explique (obrigatório)</span><textarea id="c-texto" maxlength="1500" placeholder="Ex.: a falta do dia 10/10 foi abonada com atestado."></textarea></label>
    <p class="erro" id="c-erro"></p>
    <div class="acoes"><button class="btn-sec laranja" id="c-enviar">Enviar ao RH</button><button class="btn-sec" id="c-cancelar">Cancelar</button></div>`);
  $("#c-cancelar").onclick = fecharModal;
  $("#c-enviar").onclick = async () => {
    const texto = $("#c-texto").value.trim(), btn = $("#c-enviar");
    if(texto.length < 5){ $("#c-erro").textContent = "Escreva o que precisa ser corrigido."; return; }
    btn.disabled = true; btn.textContent = "Enviando…";
    try{
      const j = await api("contestar", {competencia:E.mes, colaborador:p.nome.toUpperCase(), funcao:p.funcao, tipo:$("#c-tipo").value,
        texto, valor_visto:p.total, versao:d.versao||1});
      E.cont.push(j.contestacao); fecharModal(); render(); toast("Contestação enviada ao RH");
    }catch(e){ $("#c-erro").textContent = "Não foi enviada: " + e.message; btn.disabled = false; btn.textContent = "Enviar ao RH"; }
  };
  $("#c-texto").focus();
}
function valorAtual(c){
  const d = dadosLoja(c.loja, c.competencia); if(!d) return null;
  const p = d.pessoas.find(x => x.nome.toUpperCase() === c.colaborador); return p ? p.total : null;
}
function abrirSino(filtro){
  filtro = filtro || "Abertas";
  const lista = E.cont.filter(c => filtro === "Todas" || (filtro === "Abertas" ? c.status === "Aberta" : c.status === "Em análise"))
    .sort((a,b) => String(b.criado_em).localeCompare(String(a.criado_em)));
  const cont = n => E.cont.filter(c => n==="Todas" || (n==="Abertas"?c.status==="Aberta":c.status==="Em análise")).length;
  abrirModal(`<h3>Contestações das lojas</h3>
    <p>${E.servOk===false?"Sem conexão com o serviço agora. ":""}Responda aqui: a loja vê a resposta no cartão do colaborador.</p>
    <div class="filtros-c">${["Abertas","Em análise","Todas"].map(f=>`<button class="btn-sec" data-filtro="${f}" aria-pressed="${f===filtro}">${f} (${cont(f)})</button>`).join("")}
      <button class="btn-sec" id="s-atualizar">Atualizar</button></div>
    <div class="lista-c">${lista.length ? lista.map(c => { const va = valorAtual(c); return `<div class="item-cont" data-id="${esc(c.id)}">

      <small>${compExt(c.competencia)} · ${esc(c.tipo)} · enviada ${esc(dataBR(c.criado_em))}${c.versao?` · versão ${c.versao}`:""}</small>
      <div>${esc(c.texto)}</div>
      ${c.colaborador!=="(LOJA)"?`<small>Valor visto pela loja: ${brl(Number(c.valor_visto))}${va!=null&&Math.abs(va-Number(c.valor_visto))>.005?` · <b style="color:var(--verde)">valor atual ${brl(va)}</b>`:""}</small>`:""}
      <label class="campo-m" style="margin:4px 0 0"><span>Resposta para a loja</span><textarea class="s-resp" maxlength="1500">${esc(c.resposta||"")}</textarea></label>
      <div class="acoes" style="margin-top:4px">
        <select class="mini s-status">${["Aberta","Em análise","Resolvida","Recusada"].map(x=>`<option ${x===c.status?"selected":""}>${x}</option>`).join("")}</select>

      </div></div>`; }).join("") : '<p class="vazio">Nenhuma contestação aqui.</p>'}</div>
    <div class="acoes"><button class="btn-sec" id="s-fechar">Fechar</button></div>`);
  $("#s-fechar").onclick = fecharModal;

  document.querySelectorAll("[data-filtro]").forEach(b => b.onclick = () => abrirSino(b.dataset.filtro));
  document.querySelectorAll(".lista-c .item-cont").forEach(box => {
    const c = E.cont.find(x => x.id === box.dataset.id);
    box.querySelector(".s-salvar").onclick = async ev => {
      const btn = ev.currentTarget, st = box.querySelector(".s-status").value, resp = box.querySelector(".s-resp").value.trim();
      if(st !== "Aberta" && st !== "Em análise" && !resp){ toast("Escreva a resposta para a loja."); return; }
      btn.disabled = true; btn.textContent = "Salvando…";
      try{ await api("responder", {id:c.id, status:st, resposta:resp}); Object.assign(c, {status:st, resposta:resp, respondido_em:new Date().toISOString()});
        atualizarSino(); toast("Resposta salva · a loja já vê"); abrirSino(filtro); }
      catch(e){ toast("Não salvou: " + e.message); btn.disabled = false; btn.textContent = "Salvar resposta"; }
    };
    box.querySelector(".s-abrir").onclick = () => {
      fecharModal(); E.mes = c.competencia; $("#sel-mes").value = c.competencia; E.loja = c.loja; E.aba = "equipe";
      const d = dadosLoja(c.loja); const i = d ? d.pessoas.findIndex(x => x.nome.toUpperCase() === c.colaborador) : -1;

    };
  });
}

    </div></div></div>`;
  const fechar = () => $("#modal-raiz").innerHTML = "";
  $("#m-fechar").onclick = fechar;
  $("#mf").onclick = e => { if(e.target.id==="mf") fechar(); };
  $("#m-copiar").onclick = async () => {
    const t = $("#txt-mot"); t.focus(); t.select();
    try{ await navigator.clipboard.writeText(t.value); toast("Texto copiado"); }
    catch(e){ try{ document.execCommand("copy") ? toast("Texto copiado") : toast("Use Ctrl+C: o texto já está selecionado"); }catch(_){ toast("Use Ctrl+C: o texto já está selecionado"); } }
  };
  $("#m-baixar").onclick = () => {
    try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt],{type:"text/plain"}));
      a.download = `${E.mes}.txt`; document.body.appendChild(a); a.click(); a.remove(); toast("Se o download não começar, use Copiar texto"); }
    catch(e){ toast("Download bloqueado aqui. Use Copiar texto."); }
  };

}

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("ver"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("ver"), 2200); }

$("#btn-entrar").onclick = entrar;
$("#btn-motivos").onclick = () => { _ancora = $("#btn-motivos"); abrirModalMotivos(); };
$("#btn-sino").onclick = () => { _ancora = $("#btn-sino"); abrirSino("Abertas"); };
$("#btn-cheia").onclick = () => {
  if(EM_IFRAME){ const w = window.open(location.href, "_blank"); if(w){ toast("Aberta em nova aba. Entre com a senha de novo."); return; } }
  const el = document.documentElement;
  try{ if(document.fullscreenElement) document.exitFullscreen(); else (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }catch(e){ toast("Tela inteira indisponível aqui"); } };
document.addEventListener("keydown", e => { if(e.key==="Escape" && $("#mf")) fecharModal(); });
$("#senha").addEventListener("keydown", e => { if(e.key==="Enter") entrar(); });
$("#sel-mes").onchange = e => { E.mes = e.target.value; E.aberto = null; render(); };
$("#btn-tema").onclick = () => { aplicarTema(TEMAS[(TEMAS.indexOf(document.documentElement.dataset.tema)+1)%3]); toast("Tema: "+NOMES_T[document.documentElement.dataset.tema]); };
$("#btn-sair").onclick = () => { $("#modal-raiz").innerHTML=""; clearInterval(E._poll); Object.assign(E,{papel:null,lojas:{},sup:{},loja:null,aberto:null,busca:"",token:null,cont:[],motR:{}}); $("#app").classList.add("oculto"); $("#entrada").classList.remove("oculto"); $("#principal").innerHTML=""; $("#painel").innerHTML=""; window.scrollTo(0,0); };
$("#btn-logo").onclick = () => { E.aba = E.papel==="rh" ? "lojas" : "equipe"; E.aberto=null; render(); };
window.addEventListener("resize", moverIndicador);
document.addEventListener("keydown", e => { if(e.key==="/" && !/INPUT|SELECT/.test(document.activeElement.tagName)){ const b=$("#busca-pessoa")||$("#busca-loja"); if(b){e.preventDefault(); b.focus();} } });
aplicarTema(TEMAS.includes(temaAtual) ? temaAtual : "escuro");
montarEntrada();
</script>
